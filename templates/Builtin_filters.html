{% load usdf %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>

        <!--Builtin Filters-->
        <!-- character -->
         <h1>{{data}}</h1> 
        <h1>{{data|upper}}</h1>
        <h1>{{data|lower}}</h1>
        <h1>{{data|capfirst}}</h1>
        <h1>{{data|title}}</h1>
        <h1>{{data|length}}</h1>
        <h1>{{data|truncatechars:'4'}}</h1>
        <h1>{{data|truncatewords:'2'}}</h1>
        <h1>{{data|slice:'4'}}</h1>

        <!-- datetime -->
        <!-- <h1>{{dt}}</h1> 
        <h1>{{dt|date:'Y'}}</h1>
        <h1>{{dt|date:'j'}}</h1>
        <h1>{{dt|date:'M'}}</h1> -->
        <!-- Pluralize 
         <h1>i have {{c}} cat{{c|pluralize}}</h1>
         <h1>i have {{c}} mango{{c|pluralize:'es'}}</h1>
         <h1>this {{c}} pen{{c|pluralize}} {{c|pluralize:'is,are'}} mine</h1>-->
    </center>
</body>
</html>
